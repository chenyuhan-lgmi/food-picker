<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>食刻 TASTE — 好好吃饭，轻盈一点</title>
<style>
:root{
  --bg:#f3efe8; --card:#fff; --ink:#1a1814; --muted:#8a8378;
  --brown:#8b6f4e; --line:#e5dfd5; --black:#1a1814;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
.serif{font-family:Georgia,"Times New Roman","Songti SC",serif}
.wrap{max-width:1280px;margin:0 auto;padding:0 32px}

/* Nav */
nav{display:flex;align-items:center;justify-content:space-between;padding:24px 0}
.brand{font-size:22px;font-weight:700;letter-spacing:2px}
.brand span{font-size:11px;color:var(--muted);font-weight:400;letter-spacing:3px;margin-left:6px}
.nav-links{display:flex;gap:32px;font-size:14px;color:var(--muted)}
.nav-links a{color:var(--muted);text-decoration:none;transition:color .2s}
.nav-links a:hover{color:var(--ink)}
.nav-right{display:flex;align-items:center;gap:12px}
.avatar{width:36px;height:36px;border-radius:50%;background:#ddd;display:flex;align-items:center;justify-content:center;font-size:14px;overflow:hidden}
.pill{background:var(--black);color:#fff;border:none;padding:9px 18px;border-radius:50px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px;transition:opacity .2s}
.pill:hover{opacity:.85}
.pill .num{background:rgba(255,255,255,.2);border-radius:20px;padding:1px 8px;font-size:12px}

/* Hero */
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:24px;margin:16px 0 40px}
.hero-left{background:var(--card);border-radius:24px;padding:48px;display:flex;flex-direction:column;justify-content:space-between;min-height:440px;position:relative}
.hero-top{display:flex;justify-content:space-between;font-size:11px;letter-spacing:2px;color:var(--muted)}
.hero-top .line::before{content:"";display:inline-block;width:30px;height:1px;background:var(--muted);vertical-align:middle;margin-right:10px}
.hero-left h1{font-size:56px;line-height:1.15;font-weight:700;margin:24px 0;letter-spacing:-1px}
.hero-desc{color:var(--muted);font-size:14px;max-width:380px;line-height:1.8}
.search-row{display:flex;gap:10px;margin-top:32px}
.search-row input{flex:1;border:1px solid var(--line);border-radius:50px;padding:14px 22px;font-size:14px;outline:none;background:var(--bg)}
.search-row input:focus{border-color:var(--brown)}
.btn-brown{background:var(--brown);color:#fff;border:none;border-radius:50px;padding:14px 26px;font-size:14px;cursor:pointer;white-space:nowrap}
.hero-stats{position:absolute;right:48px;bottom:48px;text-align:right}
.hero-stats .big{font-size:48px;font-weight:700;line-height:1}
.hero-stats .lbl{font-size:11px;letter-spacing:3px;color:var(--muted);margin-top:4px}
.hero-right{border-radius:24px;overflow:hidden;position:relative;min-height:440px}
.hero-right img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.hero-right .overlay{position:absolute;left:28px;bottom:24px;color:#fff}
.hero-right .overlay .tag{font-size:11px;letter-spacing:2px;opacity:.8}
.hero-right .overlay .name{font-size:22px;font-weight:600;margin-top:4px}
.hero-right .badge{position:absolute;right:24px;bottom:24px;background:rgba(255,255,255,.9);padding:6px 14px;border-radius:20px;font-size:12px;color:var(--ink)}

/* Menu header */
.menu-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:24px}
.menu-head .eyebrow{font-size:11px;letter-spacing:3px;color:var(--muted);margin-bottom:8px}
.menu-head h2{font-size:32px;font-weight:700}
.menu-head .side{color:var(--muted);font-size:13px;max-width:320px;text-align:right}

/* Categories */
.cats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:28px}
.cat{padding:8px 18px;border-radius:50px;border:1px solid var(--line);background:transparent;font-size:13px;cursor:pointer;transition:all .2s;color:var(--muted)}
.cat:hover{border-color:var(--ink)}
.cat.active{background:var(--black);color:#fff;border-color:var(--black)}

/* Grid */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;padding-bottom:60px}
.dish{background:var(--card);border-radius:18px;overflow:hidden;transition:transform .2s,box-shadow .2s}
.dish:hover{transform:translateY(-3px);box-shadow:0 12px 32px rgba(0,0,0,.08)}
.dish-img{height:200px;position:relative;overflow:hidden;background:#eee}
.dish-img img{width:100%;height:100%;object-fit:cover}
.heart{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.9);border:none;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .2s}
.heart:hover{transform:scale(1.1)}
.heart.liked{background:var(--black);color:#fff}
.dish-body{padding:18px 20px 20px}
.dish-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:8px}
.dish-name{font-size:18px;font-weight:700;margin-bottom:4px}
.dish-desc{font-size:13px;color:var(--muted);margin-bottom:16px;line-height:1.5}
.dish-foot{display:flex;justify-content:space-between;align-items:center}
.price{font-size:15px;font-weight:700}
.price small{font-size:11px;color:var(--muted);font-weight:400;margin-left:4px}
.add-btn{border:1px solid var(--line);background:#fff;border-radius:50px;padding:7px 16px;font-size:13px;cursor:pointer;transition:all .2s}
.add-btn:hover{border-color:var(--ink)}
.add-btn.added{background:var(--black);color:#fff;border-color:var(--black)}

/* Toast */
#toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--black);color:#fff;padding:12px 24px;border-radius:50px;font-size:14px;opacity:0;transition:all .3s;z-index:99}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:900px){
  .hero{grid-template-columns:1fr}
  .grid{grid-template-columns:repeat(2,1fr)}
  .hero-left h1{font-size:38px}
  .nav-links{display:none}
}
@media(max-width:560px){
  .grid{grid-template-columns:1fr}
  .wrap{padding:0 16px}
}
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <div class="brand">食刻<span>TASTE / 01</span></div>
    <div class="nav-links"><a href="#menu">轻食菜单</a><a href="#">按心情</a><a href="#" onclick="randomPick();return false">随机一餐</a></div>
    <div class="nav-right">
      <div class="avatar">D</div>
      <button class="pill">我的收藏 <span class="num" id="favCount">0</span></button>
      <button class="pill">选餐清单 <span class="num" id="cartCount">0</span></button>
    </div>
  </nav>

  <section class="hero">
    <div class="hero-left">
      <div>
        <div class="hero-top"><span class="line">EVERYDAY LIGHT EATING</span><span>FOOD / 01</span></div>
        <h1 class="serif">好好吃饭，<br>轻盈一点。</h1>
        <p class="hero-desc">能量碗、热食焖饭、多多卷、帕尼尼和清爽沙拉。按口味与心情，挑一份今天想吃的轻食。</p>
        <div class="search-row">
          <input id="searchInput" placeholder="搜索：鸡胸 / 牛肉 / 藜麦 / 素食...">
          <button class="btn-brown" onclick="doSearch()">开始选餐</button>
        </div>
      </div>
      <div class="hero-stats"><div class="big" id="totalNum">24</div><div class="lbl">MENU IDEAS</div></div>
    </div>
    <div class="hero-right">
      <img src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=800&q=80" alt="editor pick">
      <div class="overlay"><div class="tag">EDITOR'S PICK · 01</div><div class="name">香草鸡胸谷物碗</div></div>
      <div class="badge">谷物 / 丰盛</div>
    </div>
  </section>

  <section id="menu">
    <div class="menu-head">
      <div><div class="eyebrow">THE LIGHT MENU</div><h2 class="serif">24 种轻食，随心挑选</h2></div>
      <div class="side">从热乎乎的焖饭到新鲜的能量碗，不同胃口都有合适的一份。</div>
    </div>
    <div class="cats" id="cats"></div>
    <div class="grid" id="grid"></div>
  </section>
</div>

<div id="toast"></div>

<script>
const dishes=[
  {name:"香草鸡胸谷物碗",cat:"谷物能量碗",desc:"烤鸡胸配牛油果、藜麦与时蔬。",price:42,time:"15-20 min",img:"https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=600&q=80"},
  {name:"烤南瓜藜麦沙拉",cat:"鲜蔬沙拉",desc:"烤南瓜与藜麦拌入嫩叶菜，点缀坚果碎。",price:36,time:"10-15 min",img:"https://images.unsplash.com/photo-1512621776951-a57141f2eefd?w=600&q=80"},
  {name:"地中海鹰嘴豆沙拉",cat:"鲜蔬沙拉",desc:"鹰嘴豆、番茄与黄瓜，带一点橄榄香。",price:37,time:"10-15 min",img:"https://images.unsplash.com/photo-1505253758410-73172bafb0f8?w=600&q=80"},
  {name:"香草烤薯角",cat:"小食饮品",desc:"香草和海盐提味，作为主餐旁边的小小满足。",price:18,time:"8-12 min",img:"https://images.unsplash.com/photo-1518977676601-b53f82aba655?w=600&q=80"},
  {name:"酸奶莓果杯",cat:"小食饮品",desc:"原味酸奶搭配莓果与少量谷物脆。",price:22,time:"5-8 min",img:"https://images.unsplash.com/photo-1488477181946-6428a0291777?w=600&q=80"},
  {name:"柠檬薄荷气泡饮",cat:"小食饮品",desc:"柠檬与薄荷带来清透的口感。",price:16,time:"3-5 min",img:"https://images.unsplash.com/photo-1621263764028-ec9c9f362a37?w=600&q=80"},
  {name:"燕麦拿铁",cat:"小食饮品",desc:"柔和燕麦香与咖啡融合，热饮或冰饮都合适。",price:20,time:"3-5 min",img:"https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=600&q=80"},
  {name:"香烤鸡胸暖碗",cat:"暖食焖饭",desc:"温热谷物底配嫩烤鸡胸与时蔬。",price:39,time:"15 min",img:"https://images.unsplash.com/photo-1546833999-b9f581a1996d?w=600&q=80"},
  {name:"牛油果多多卷",cat:"多多卷",desc:"牛油果、蔬菜与全麦卷饼，清爽管饱。",price:28,time:"5-10 min",img:"https://images.unsplash.com/photo-1521341050502-9bd9bac2af71?w=600&q=80"},
  {name:"全麦帕尼尼",cat:"帕尼尼",desc:"热压全麦面包夹番茄马苏里拉。",price:26,time:"8 min",img:"https://images.unsplash.com/photo-1528735602780-2552fd46c7af?w=600&q=80"},
  {name:"泰式牛肉沙拉",cat:"鲜蔬沙拉",desc:"轻辣牛肉配薄荷、生菜与青柠汁。",price:42,time:"12 min",img:"https://images.unsplash.com/photo-1552769569-c9f6b42e5e1e?w=600&q=80"},
  {name:"时蔬糙米饭",cat:"暖食焖饭",desc:"糙米焖配当季蔬菜与菌菇。",price:32,time:"15 min",img:"https://images.unsplash.com/photo-1512058564366-18510be2db19?w=600&q=80"},
];
const cats=["全部","谷物能量碗","暖食焖饭","多多卷","帕尼尼","鲜蔬沙拉","小食饮品"];
let activeCat="全部",cart=0,favs=0;

const catsEl=document.getElementById("cats"),gridEl=document.getElementById("grid");
cats.forEach(c=>{
  const b=document.createElement("button");
  b.className="cat"+(c===activeCat?" active":"");b.textContent=c;
  b.onclick=()=>{activeCat=c;render();};
  catsEl.appendChild(b);
});

function render(filter=""){
  gridEl.innerHTML="";
  let list=dishes.filter(d=>activeCat==="全部"||d.cat===activeCat);
  if(filter) list=list.filter(d=>d.name.includes(filter)||d.desc.includes(filter));
  list.forEach((d,i)=>{
    const card=document.createElement("div");card.className="dish";
    card.innerHTML=`
      <div class="dish-img"><img src="${d.img}" loading="lazy" alt="${d.name}">
        <button class="heart" onclick="event.stopPropagation();toggleFav(this)">♡</button></div>
      <div class="dish-body">
        <div class="dish-meta"><span>${d.cat}</span><span>${d.time}</span></div>
        <div class="dish-name">${d.name}</div>
        <div class="dish-desc">${d.desc}</div>
        <div class="dish-foot">
          <div class="price">¥${d.price}<small>示意价</small></div>
          <button class="add-btn" onclick="addToCart(this,'${d.name}')">+ 加入清单</button>
        </div>
      </div>`;
    gridEl.appendChild(card);
  });
  document.querySelectorAll(".cat").forEach(b=>b.classList.toggle("active",b.textContent===activeCat));
}
function toggleFav(el){
  el.classList.toggle("liked");
  const liked=el.classList.contains("liked");
  el.textContent=liked?"♥":"♡";
  favs+=liked?1:-1;
  document.getElementById("favCount").textContent=favs;
}
function addToCart(btn,name){
  if(btn.classList.contains("added")){
    btn.classList.remove("added");btn.textContent="+ 加入清单";cart--;
  }else{
    btn.classList.add("added");btn.textContent="✓ 已加入";cart++;
    showToast("已加入："+name);
  }
  document.getElementById("cartCount").textContent=cart;
}
function showToast(msg){
  const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),2000);
}
function doSearch(){render(document.getElementById("searchInput").value.trim());}
document.getElementById("searchInput").addEventListener("keydown",e=>{if(e.key==="Enter")doSearch();});
function randomPick(){
  const d=dishes[Math.floor(Math.random()*dishes.length)];
  showToast("今日推荐："+d.name+" ¥"+d.price);
  document.getElementById("menu").scrollIntoView({behavior:"smooth"});
}
render();
</script>
</body>
</html>
