<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今天吃什么？ - 美食选菜助手</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: linear-gradient(135deg, #ff9a56 0%, #ff6b6b 50%, #ee5a6f 100%);
  min-height: 100vh; color: #333; padding-bottom: 40px;
}
.header { text-align: center; padding: 40px 20px 20px; color: #fff; }
.header h1 { font-size: 2.4em; margin-bottom: 8px; text-shadow: 0 2px 8px rgba(0,0,0,.15); }
.header p { font-size: 1.1em; opacity: .95; }
.roulette-box {
  max-width: 500px; margin: 20px auto; background: #fff; border-radius: 24px;
  padding: 30px 20px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.2);
}
.roulette-result {
  font-size: 2.2em; font-weight: 700; min-height: 70px; display: flex;
  align-items: center; justify-content: center; gap: 10px; color: #ff6b6b;
}
.roulette-result .emoji { font-size: 1.5em; }
.roulette-desc { color: #888; font-size: .95em; margin-top: 6px; min-height: 24px; }
.btn-spin {
  margin-top: 18px; background: linear-gradient(135deg, #ff6b6b, #ee5a6f); color: #fff;
  border: none; padding: 14px 44px; font-size: 1.15em; border-radius: 50px; cursor: pointer;
  font-weight: 700; box-shadow: 0 8px 20px rgba(238,90,111,.4); transition: transform .15s;
}
.btn-spin:hover { transform: translateY(-2px); }
.btn-spin:active { transform: scale(.97); }
.btn-spin:disabled { opacity: .6; cursor: not-allowed; }
.categories {
  display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;
  max-width: 800px; margin: 24px auto; padding: 0 16px;
}
.cat-btn {
  background: rgba(255,255,255,.25); color: #fff; border: 2px solid transparent;
  padding: 8px 20px; border-radius: 50px; cursor: pointer; font-size: .95em; font-weight: 600;
  backdrop-filter: blur(8px); transition: all .2s;
}
.cat-btn:hover { background: rgba(255,255,255,.4); }
.cat-btn.active { background: #fff; color: #ff6b6b; border-color: #fff; }
.grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 16px; max-width: 1000px; margin: 0 auto; padding: 0 16px;
}
.card {
  background: #fff; border-radius: 18px; padding: 20px; text-align: center;
  box-shadow: 0 4px 16px rgba(0,0,0,.08); transition: transform .2s, box-shadow .2s;
  cursor: pointer; position: relative;
}
.card:hover { transform: translateY(-4px); box-shadow: 0 12px 28px rgba(0,0,0,.15); }
.card .emoji { font-size: 3em; display: block; margin-bottom: 8px; }
.card .name { font-size: 1.15em; font-weight: 700; margin-bottom: 4px; }
.card .tag {
  display: inline-block; background: #fff0ed; color: #ee5a6f; font-size: .8em;
  padding: 3px 12px; border-radius: 20px; margin-top: 6px;
}
.card .like {
  position: absolute; top: 12px; right: 12px; font-size: 1.3em; cursor: pointer;
  opacity: .3; transition: all .2s;
}
.card .like.liked { opacity: 1; transform: scale(1.2); }
.footer { text-align: center; color: rgba(255,255,255,.8); margin-top: 40px; font-size: .9em; }
@media (max-width: 480px) {
  .header h1 { font-size: 1.8em; }
  .roulette-result { font-size: 1.6em; }
}
</style>
</head>
<body>
<div class="header">
  <h1>🍜 今天吃什么？</h1>
  <p>选择困难症救星，一键帮你决定！</p>
</div>

<div class="roulette-box">
  <div class="roulette-result" id="result">
    <span class="emoji">👆</span><span>点下面按钮</span>
  </div>
  <div class="roulette-desc" id="resultDesc">不知道吃什么？让命运来选！</div>
  <button class="btn-spin" id="spinBtn">🎲 帮我选一个</button>
</div>

<div class="categories" id="cats"></div>
<div class="grid" id="grid"></div>

<div class="footer">Made with ❤️ · 吃饱了才有力气干活</div>

<script>
const dishes = [
  {name:"火锅",emoji:"🍲",cat:"中餐",desc:"麻辣鲜香，朋友聚会首选"},
  {name:"麻辣烫",emoji:"🌶️",cat:"中餐",desc:"自选食材，想吃啥煮啥"},
  {name:"兰州拉面",emoji:"🍜",cat:"面食",desc:"一清二白三红四绿"},
  {name:"北京烤鸭",emoji:"🦆",cat:"中餐",desc:"皮脆肉嫩，配上薄饼"},
  {name:"小笼包",emoji:"🥟",cat:"中餐",desc:"皮薄汁多，先喝汤再吃包"},
  {name:"红烧肉",emoji:"🍖",cat:"中餐",desc:"肥而不腻，入口即化"},
  {name:"汉堡薯条",emoji:"🍔",cat:"快餐",desc:"快速解决，快乐加倍"},
  {name:"披萨",emoji:"🍕",cat:"西餐",desc:"拉丝芝士，满足感爆棚"},
  {name:"牛排",emoji:"🥩",cat:"西餐",desc:"仪式感拉满的一餐"},
  {name:"意面",emoji:"🍝",cat:"西餐",desc:"番茄罗勒，经典美味"},
  {name:"寿司",emoji:"🍣",cat:"日料",desc:"新鲜刺身，精致小巧"},
  {name:"拉面",emoji:"🍥",cat:"日料",desc:"浓厚汤底，溏心蛋加分"},
  {name:"烤肉",emoji:"🍢",cat:"烧烤",desc:"滋滋冒油，大口吃肉"},
  {name:"烤串",emoji:"🍡",cat:"烧烤",desc:"夜宵灵魂，啤酒搭档"},
  {name:"炸鸡",emoji:"🍗",cat:"快餐",desc:"外酥里嫩，配啤酒绝了"},
  {name:"炒饭",emoji:"🍚",cat:"中餐",desc:"镬气十足，简单满足"},
  {name:"饺子",emoji:"🥟",cat:"面食",desc:"冬至必吃，蘸醋更香"},
  {name:"汉堡王",emoji:"🍔",cat:"快餐",desc:"火烤牛肉，嘴大才能咬"},
  {name:"蛋糕",emoji:"🍰",cat:"甜品",desc:"下午茶时光，甜蜜治愈"},
  {name:"奶茶",emoji:"🧋",cat:"甜品",desc:"珍珠奶茶，快乐源泉"},
  {name:"冰淇淋",emoji:"🍦",cat:"甜品",desc:"夏天的命都是它给的"},
  {name:"沙拉",emoji:"🥗",cat:"西餐",desc:"轻食健康，清爽无负担"},
  {name:"粥",emoji:"🥣",cat:"中餐",desc:"养胃暖心，宿醉救星"},
  {name:"盖浇饭",emoji:"🍛",cat:"中餐",desc:"菜饭一体，实惠管饱"},
];
const cats = ["全部","中餐","西餐","日料","烧烤","面食","快餐","甜品"];
let activeCat = "全部";

const catsEl = document.getElementById("cats");
const gridEl = document.getElementById("grid");
cats.forEach(c => {
  const b = document.createElement("button");
  b.className = "cat-btn" + (c===activeCat?" active":"");
  b.textContent = c;
  b.onclick = () => { activeCat = c; render(); };
  catsEl.appendChild(b);
});

function render() {
  gridEl.innerHTML = "";
  const list = activeCat==="全部" ? dishes : dishes.filter(d=>d.cat===activeCat);
  list.forEach(d => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `<span class="like">🤍</span><span class="emoji">${d.emoji}</span>
      <div class="name">${d.name}</div><span class="tag">${d.cat}</span>`;
    card.querySelector(".like").onclick = (e) => {
      e.stopPropagation();
      const el = card.querySelector(".like");
      el.classList.toggle("liked");
      el.textContent = el.classList.contains("liked") ? "❤️" : "🤍";
    };
    card.onclick = () => {
      document.getElementById("result").innerHTML = `<span class="emoji">${d.emoji}</span><span>${d.name}</span>`;
      document.getElementById("resultDesc").textContent = d.desc;
      window.scrollTo({top:0,behavior:"smooth"});
    };
    gridEl.appendChild(card);
  });
  document.querySelectorAll(".cat-btn").forEach(b => {
    b.classList.toggle("active", b.textContent===activeCat);
  });
}

const btn = document.getElementById("spinBtn");
btn.onclick = () => {
  btn.disabled = true;
  const list = activeCat==="全部" ? dishes : dishes.filter(d=>d.cat===activeCat);
  let i = 0;
  const timer = setInterval(() => {
    const d = list[Math.floor(Math.random()*list.length)];
    document.getElementById("result").innerHTML = `<span class="emoji">${d.emoji}</span><span>${d.name}</span>`;
    document.getElementById("resultDesc").textContent = "···";
    i++;
    if (i > 12) {
      clearInterval(timer);
      const pick = list[Math.floor(Math.random()*list.length)];
      document.getElementById("result").innerHTML = `<span class="emoji">${pick.emoji}</span><span>${pick.name}</span>`;
      document.getElementById("resultDesc").textContent = pick.desc + " 🎉";
      btn.disabled = false;
    }
  }, 80);
};

render();
</script>
</body>
</html>
